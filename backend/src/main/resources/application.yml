spring:
  application:
    name: ganadera
  profiles:
    # Se usa solo si no hay otro perfil activo (SPRING_PROFILES_ACTIVE o @ActiveProfiles)
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  mail:
    # false: los emails no se mandan, el contenido (con el link) se escribe en el log. Solo para desarrollo.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@gestion-ganadera.local}
  invitaciones:
    # URL de la web: los links de invitación son {web-url}/invitacion/{token}
    web-url: ${APP_WEB_URL:http://localhost:5173}
    # Cuánto dura un link antes de vencer
    ttl: ${INVITACION_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Clave para firmar los tokens (HS256, mínimo 32 caracteres).
    # Este valor por defecto es SOLO para desarrollo: en producción se exige JWT_SECRET (ver application-prod.yml).
    secret: ${JWT_SECRET:dev-solo-local-no-usar-en-produccion-0123456789}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  categorias:
    # Reglas de cambio automático de categoría (issue #16). Valores iniciales, a validar con producción.
    # Ternero/a que no tuvo destete registrado pasa de categoría a esta edad
    meses-destete: ${CATEGORIA_MESES_DESTETE:8}
    # Novillito -> novillo y torito -> toro a esta edad...
    meses-adulto: ${CATEGORIA_MESES_ADULTO:24}
    # ...o al registrar un pesaje de al menos estos kilos
    kilos-novillo: ${CATEGORIA_KILOS_NOVILLO:400}
    kilos-toro: ${CATEGORIA_KILOS_TORO:450}
  jobs:
    habilitados: ${JOBS_HABILITADOS:true}
    # Cron de Spring (segundo minuto hora día mes día-semana), hora de Argentina
    cambio-categoria-cron: ${JOB_CAMBIO_CATEGORIA_CRON:0 0 3 * * *}
