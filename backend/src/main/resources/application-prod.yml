# Producción: todo sale de variables de entorno, sin valores por defecto
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

app:
  jwt:
    # Sin valor por defecto: si falta JWT_SECRET la app no arranca
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
